<style>
/* Layout idea: one centered column. A breathing mandala is the focus; the spoken line and controls sit beneath it. */
:root {
  --bg: #0b0920;
  --bg2: #15113a;
  --ink: #f1ebdc;
  --muted: #a9a3c6;
  --gold: #e3b96a;
  --c: #e3b96a;
  --line: rgba(227,185,106,.22);
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --deva: "Noto Serif Devanagari", "Noto Sans Devanagari", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--bg2) 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
main { padding-top: max(24px, env(safe-area-inset-top)) !important; position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 24px 18px 56px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; text-wrap: balance; margin: 0; }
.hero { text-align: center; display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
h1 { font-size: clamp(34px, 9vw, 52px); line-height: 1.05; }
.lede { color: var(--muted); max-width: 46ch; margin: 0 auto; }

.stage { position: relative; width: min(100%, 440px); aspect-ratio: 1; margin: 0 auto; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.glyph {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none;
}
.glyph .sym { font-family: var(--deva); font-size: clamp(48px, 15vw, 76px); line-height: 1; color: var(--c); text-shadow: 0 0 28px var(--c); transition: color .8s; }
.glyph .rom { font-family: var(--display); font-size: 20px; letter-spacing: .18em; color: var(--ink); opacity: .85; margin-top: 4px; min-height: 28px; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.btn-start {
  align-self: center; border: 1px solid var(--gold); background: linear-gradient(180deg, rgba(227,185,106,.25), rgba(227,185,106,.08));
  color: var(--ink); font-family: var(--display); font-size: 24px; font-weight: 600; letter-spacing: .04em;
  padding: 14px 40px; border-radius: 999px; min-height: 52px; box-shadow: 0 0 40px rgba(227,185,106,.18);
  transition: transform .2s, box-shadow .2s;
}
.btn-start:hover { transform: translateY(-1px); box-shadow: 0 0 56px rgba(227,185,106,.3); }
.hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: -8px; }

.hidden { display: none !important; }

#session { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.dots { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--dc, var(--gold)); background: transparent; padding: 0; transition: all .5s; opacity: .55; }
.dot.small { width: 9px; height: 9px; }
.dot.done { background: var(--dc, var(--gold)); opacity: .5; }
.dot.on { background: var(--dc, var(--gold)); opacity: 1; box-shadow: 0 0 14px var(--dc, var(--gold)); transform: scale(1.25); }
.title { font-size: clamp(26px, 7vw, 34px); color: var(--c); transition: color .8s; }
.sub { color: var(--muted); font-size: 14px; letter-spacing: .04em; margin-top: -8px; }
.cue { font-family: var(--display); font-size: clamp(30px, 9vw, 44px); min-height: 1.2em; letter-spacing: .06em; }
.caption { min-height: 6.2em; max-width: 46ch; font-size: 17px; color: var(--ink); opacity: .92; transition: opacity .6s; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ctl { border: 1px solid var(--line); background: rgba(255,255,255,.04); border-radius: 999px; padding: 10px 20px; min-height: 44px; font-size: 15px; }
.ctl:hover { border-color: var(--gold); }
.settings { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; align-items: center; color: var(--muted); font-size: 14px; }
.settings label { display: flex; align-items: center; gap: 10px; }
input[type=range] { accent-color: var(--gold); width: 130px; }
select { background: rgba(255,255,255,.06); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 14px; }
select option { color: #111; }
input[type=checkbox] { accent-color: var(--gold); width: 18px; height: 18px; }

.path { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
.path h2 { font-size: 26px; padding: 22px 0 6px; }
.row { display: grid; grid-template-columns: 14px 1fr auto; gap: 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.row .sw { width: 12px; height: 12px; border-radius: 50%; background: var(--dc); margin-top: 7px; box-shadow: 0 0 12px var(--dc); }
.row .nm { font-family: var(--display); font-size: 21px; line-height: 1.2; }
.row .ds { font-size: 14px; color: var(--muted); }
.row .mt { font-family: var(--display); font-size: 22px; color: var(--dc); letter-spacing: .08em; text-align: right; }
.row .mt small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.credit { font-size: 13px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { .btn-start, .dot { transition: none; } }
.bar { width: min(100%, 360px); height: 4px; background: rgba(255,255,255,.12); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--c); transition: background .8s; }
.time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.4em; }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<audio id="player" src="session.mp3" preload="auto" playsinline></audio>
<main>
  <header class="hero" id="hero">
    <div class="eyebrow">Karma healing</div>
    <h1>Seven chakras, base to crown</h1>
    <p class="lede">A guided chant meditation. A calm voice leads each stage and tells you what to chant. About 19 minutes. The audio keeps playing when your screen locks.</p>
  </header>

  <section class="stage" aria-label="Chakra mandala">
    <canvas id="mandala"></canvas>
    <div class="glyph"><div><div class="sym" id="sym">ॐ</div><div class="rom" id="rom"></div></div></div>
  </section>

  <section id="idle" style="display:flex;flex-direction:column;gap:18px;">
    <button class="btn-start" id="start" type="button">Start meditation</button>
    <div class="hint">Turn your sound up and use headphones if you can. Sit somewhere quiet.</div>
  </section>

  <section id="session" class="hidden" aria-live="polite">
    <div class="dots" id="dots"></div>
    <h2 class="title" id="title"></h2>
    <div class="sub" id="sub"></div>
    <div class="cue" id="cue"></div>
    <p class="caption" id="caption"></p>
    <div class="bar"><i id="barfill"></i></div>
    <div class="time" id="time"></div>
    <div class="controls">
      <button class="ctl" id="pause" type="button">Pause</button>
      <button class="ctl" id="skip" type="button">Next stage</button>
      <button class="ctl" id="end" type="button">End</button>
    </div>
  </section>

  <section class="path" id="path">
    <h2>The path</h2>
  </section>
</main>

      petals(cx, cy, n, R * .24, R * .56 * s, c.color, .5, -time * .09 + Math.PI / n, R * .14);
    } else {
      CH.forEach(function (c, i) {
        petals(cx, cy, Math.min(c.petals, 16) + (c.petals === 2 ? 6 : 0), R * (.2 + i * .02), R * (.34 + i * .07) * s, c.color, .5, time * (.03 + i * .01) * (i % 2 ? -1 : 1), R * .16);
      });
    }
    g.beginPath(); g.arc(cx, cy, R * .22, 0, 7); g.strokeStyle = hexA(col, .6); g.stroke();
    // stars
    var sw = sc.width, sh = sc.height; sg.clearRect(0, 0, sw, sh);
    stars.forEach(function (st) { var a = .25 + .25 * Math.sin(time * .6 + st.p); sg.beginPath(); sg.arc(st.x * sw, st.y * sh, st.r, 0, 7); sg.fillStyle = "rgba(241,235,220," + a + ")"; sg.fill(); });
    if (running) update();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
